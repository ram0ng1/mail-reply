# Dovecot mínimo: IMAP em 143 (STARTTLS) e 993 (SSL) e um único usuário, a
# caixa de respostas. Com Postfix entra também o dovecot-lmtp.conf.
protocols = imap
listen = 127.0.0.1
log_path = /var/log/dovecot.log
ssl = yes
ssl_cert = </etc/dovecot/mr-cert.pem
ssl_key = </etc/dovecot/mr-key.pem
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:__MAILDIR__
mail_privileged_group = mail
first_valid_uid = 100
recipient_delimiter = +
lmtp_save_to_detail_mailbox = no
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/mr-users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/mr-users
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
