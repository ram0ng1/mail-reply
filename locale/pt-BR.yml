ramon-mail-reply:
  admin:
    settings:
      reply_address_label: Caixa de resposta
      reply_address_help: "Caixa dedicada que recebe as respostas. Precisa aceitar qualquer alias +algo sob o mesmo local part. Exemplo: inbox@reply.seuforum.com."
      secret_label: Chave HMAC (avançado)
      secret_help: "Assina os aliases de resposta para que não possam ser forjados. Em branco gera uma chave aleatória no primeiro uso; o valor salvo fica cifrado. NÃO troque depois que as notificações já saíram — os aliases antigos viram inválidos."
      require_sender_match_label: "Aceitar respostas apenas do e-mail confirmado da conta"
      require_sender_match_help: "Recusa respostas cujo remetente (From) não bate com o e-mail confirmado do usuário para quem o alias foi gerado. Desative só se os usuários respondem por endereços de encaminhamento."
      max_replies_per_hour_label: Máximo de respostas por usuário por hora
      max_replies_per_hour_help: "Respostas acima do limite são recusadas. 0 = ilimitado."
      send_rejection_notices_label: Avisar o autor por e-mail quando a resposta não puder ser publicada
      send_rejection_notices_help: "Enviado só para o e-mail confirmado da conta, no máximo uma vez por dia por motivo (sem permissão, discussão indisponível ou privada, limite por hora, resposta vazia ou longa demais)."
      show_badge_label: "Mostrar selo \"por e-mail\" nas respostas"
      show_badge_help: Exibe um pequeno selo ao lado de posts criados a partir de uma resposta por e-mail.
      webhook_secret_label: Segredo do webhook
      webhook_secret_help: "Header X-Mail-Reply-Token exigido em POST /api/mail-reply/inbound. Gere com: openssl rand -hex 32"
      secret_placeholder: "[configure o segredo acima]"
      providers_help: "Configure o provedor para fazer POST direto no endpoint — sem script."
      providers_url_label: "URL do webhook:"
      providers_header_label: "Header obrigatório:"
      mailgun_signing_key_label: "Mailgun HTTP webhook signing key (opcional)"
      mailgun_signing_key_help: "Quando preenchida, requisições do Mailgun são autenticadas pela assinatura em vez do header X-Mail-Reply-Token. Armazenada cifrada."
      providers_mailgun_summary: Como configurar no Mailgun
      providers_mailgun_step1: "Mailgun → Receiving → Routes → Create Route"
      providers_mailgun_step2: "Match Recipient:"
      providers_mailgun_step3: "Action:"
      providers_mailgun_step4: "Salve a HTTP webhook signing key abaixo (Mailgun → Sending → Webhooks). Routes não enviam custom headers, então as requisições são autenticadas pela assinatura do Mailgun em vez do X-Mail-Reply-Token."
      providers_postmark_summary: Como configurar no Postmark
      providers_postmark_step1: "Postmark → Inbound Stream → Create"
      providers_postmark_step2: "Webhook URL:"
      providers_postmark_step3: "Custom header:"
