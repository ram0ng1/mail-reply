name: Hosting matrix

# Resposta por e-mail de ponta a ponta em 4 hospedagens × 4 caminhos de
# entrega, com servidores de e-mail de verdade no runner:
#
#   hospedagem: cPanel (Exim), DirectAdmin (Exim), Plesk (Postfix), VPS
#               (Postfix) — roteadores, transporte de pipe, caminho do PHP,
#               dono do Maildir e php.ini (disable_functions, open_basedir,
#               memory_limit) de cada painel; Dovecot com IMAP 143/993;
#   entrega:    pipe (MTA → script gerado pelo admin → webhook), imap-cron
#               (schedule:run, fila sync), imap-queue (fof/redis +
#               queue:work), webhook (Postmark, Mailgun, Cloudflare, JSON).
#
# Cada célula manda respostas de Gmail, Outlook, Apple Mail e Thunderbird
# mais os casos que têm de ser recusados (resposta automática, remetente
# forjado, alias adulterado, reentrega) e confere banco, caixa IMAP e o
# Reply-To de saída. Os scripts ficam em tests/hosting/ e rodam também
# localmente (tests/hosting/local.sh, um contêiner por célula).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Segunda 05:30 UTC, junto do ci.yml: pega mudanças do core e das
  # bibliotecas sem esperar um push.
  schedule:
    - cron: '30 5 * * 1'

permissions: {}

concurrency:
  group: hosting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: ${{ matrix.hosting }} × ${{ matrix.delivery }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        hosting: [cpanel, directadmin, plesk, vps]
        delivery: [pipe, imap-cron, imap-queue, webhook]
    env:
      FORUM_DIR: /srv/forum
      COMPOSER_NO_INTERACTION: 1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo_sqlite, redis, sodium, sqlite3, zip
          coverage: none
          tools: composer:v2

      # O script de pipe é gerado do mesmo TypeScript que o admin mostra.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22

      - name: Pacotes do runner
        run: sudo apt-get update -qq

      - name: Célula ${{ matrix.hosting }} × ${{ matrix.delivery }}
        run: tests/hosting/run-cell.sh "${{ matrix.hosting }}" "${{ matrix.delivery }}" "$RUNNER_TEMP/hosting-results"

      - name: Resumo
        if: always()
        run: cat "$RUNNER_TEMP/hosting-results/${{ matrix.hosting }}-${{ matrix.delivery }}.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Resultado e logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hosting-${{ matrix.hosting }}-${{ matrix.delivery }}
          path: ${{ runner.temp }}/hosting-results
          retention-days: 14
          if-no-files-found: warn

  report:
    name: Matriz 4×4
    needs: cell
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Baixar resultados
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: hosting-*
          path: results
          merge-multiple: true

      - name: Tabela
        run: tests/hosting/report.sh results >> "$GITHUB_STEP_SUMMARY"
