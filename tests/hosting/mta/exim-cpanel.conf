# Recorte do exim.conf do cPanel com o que importa para o Mail Reply: o
# forwarder "Pipe to a Program" (/etc/valiases/<domínio>), a caixa virtual em
# ~/mail/<domínio>/<usuário> e o sufixo +tag opcional nos dois roteadores.
# Caminhos de arquivo usam $domain_data/$local_part_data (Exim 4.94+ recusa
# dados "tainted" vindos do envelope).
primary_hostname = mail.forum.test
domainlist local_domains = forum.test
hostlist relay_from_hosts = <; 127.0.0.1 ; ::1
acl_smtp_rcpt = acl_check_rcpt
daemon_smtp_ports = 25
local_interfaces = <; 127.0.0.1
never_users = root
host_lookup =
log_file_path = /var/log/exim4/%slog
keep_environment =
log_selector = +delivery_size +received_recipients

begin acl

acl_check_rcpt:
  accept  domains = +local_domains
  accept  hosts = +relay_from_hosts
  deny    message = relay not permitted

begin routers

virtual_aliases:
  driver = redirect
  domains = dsearch;/etc/valiases
  local_part_suffix = +*
  local_part_suffix_optional
  allow_defer
  allow_fail
  data = ${lookup{$local_part@$domain}lsearch{/etc/valiases/$domain_data}}
  pipe_transport = virtual_address_pipe
  retry_use_local_part

virtual_user:
  driver = accept
  domains = dsearch;/home/cpuser/mail
  local_part_suffix = +*
  local_part_suffix_optional
  local_parts = dsearch;/home/cpuser/mail/$domain_data
  transport = dovecot_virtual_delivery

begin transports

virtual_address_pipe:
  driver = pipe
  user = cpuser
  group = cpuser
  return_output
  envelope_to_add
  return_path_add

dovecot_virtual_delivery:
  driver = appendfile
  directory = /home/cpuser/mail/$domain_data/$local_part_data
  maildir_format
  create_directory
  directory_mode = 0700
  mode = 0600
  user = cpuser
  group = cpuser
  delivery_date_add
  envelope_to_add
  return_path_add

begin retry

*   *   F,2h,1m

begin rewrite
