# Recorte do exim.conf do DirectAdmin: virtual_aliases lê
# /etc/virtual/<domínio>/aliases (pipe só com allow_forwarder_pipe=1),
# virtual_user entrega no Maildir do dono do domínio. O pipe roda como o dono
# (domainowners) no grupo mail e recebe a mensagem com a linha "From " do
# mbox, sem Envelope-to. Caminhos usam $domain_data/$local_part_data, como
# o exim.conf do DirectAdmin para Exim 4.94+ (dados do envelope são tainted).
primary_hostname = mail.forum.test
domainlist local_domains = lsearch;/etc/virtual/domains
hostlist relay_from_hosts = <; 127.0.0.1 ; ::1
acl_smtp_rcpt = acl_check_rcpt
daemon_smtp_ports = 25
local_interfaces = <; 127.0.0.1
never_users = root
host_lookup =
log_file_path = /var/log/exim4/%slog
keep_environment =
log_selector = +delivery_size +received_recipients

begin acl

acl_check_rcpt:
  accept  domains = +local_domains
  accept  hosts = +relay_from_hosts
  deny    message = relay not permitted

begin routers

virtual_aliases_nostar:
  driver = redirect
  domains = dsearch;/etc/virtual
  local_part_suffix = +*
  local_part_suffix_optional
  allow_defer
  allow_fail
  data = ${if exists{/etc/virtual/${domain_data}/aliases}{${lookup{$local_part}lsearch{/etc/virtual/${domain_data}/aliases}}}}
  group = mail
  pipe_transport = virtual_address_pipe
  retry_use_local_part

virtual_user:
  driver = accept
  domains = dsearch;/etc/virtual
  local_part_suffix = +*
  local_part_suffix_optional
  condition = ${lookup{$local_part}lsearch{/etc/virtual/${domain_data}/passwd}{yes}{no}}
  local_parts = dsearch;/home/${lookup{$domain}lsearch*{/etc/virtual/domainowners}{$value}}/imap/${domain_data}
  group = mail
  retry_use_local_part
  transport = virtual_localdelivery

begin transports

virtual_address_pipe:
  driver = pipe
  group = mail
  return_output
  user = "${lookup{$domain}lsearch*{/etc/virtual/domainowners}{$value}}"

virtual_localdelivery:
  driver = appendfile
  create_directory
  delivery_date_add
  directory = /home/${lookup{$domain}lsearch*{/etc/virtual/domainowners}{$value}}/imap/${domain_data}/${local_part_data}/Maildir
  directory_mode = 770
  envelope_to_add
  group = mail
  maildir_format
  mode = 0660
  return_path_add
  user = "${lookup{$domain}lsearch*{/etc/virtual/domainowners}{$value}}"

begin retry

*   *   F,2h,1m

begin rewrite
